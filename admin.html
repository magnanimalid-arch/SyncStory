<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - SyncStory</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 350px;
        }
        h1 { font-size: 20px; color: #38bdf8; margin-bottom: 20px; }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:active { background: #0369a1; }
        #resultado {
            margin-top: 20px;
            padding: 10px;
            background: #090d16;
            border: 1px dashed #38bdf8;
            border-radius: 6px;
            word-break: break-all;
            font-family: monospace;
            color: #4ade80;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🔑 Generador de Licencias</h1>
        <p style="font-size: 14px; color: #94a3b8;">Genera claves de acceso de 30 días para tus clientes.</p>
        <button onclick="generar()">Generar Nueva Licencia</button>
        <div id="resultado"></div>
    </div>

    <script>
        function generar() {
            const pin = prompt("Ingrese el PIN de Administrador:");
            if (pin !== "OroMusic$") {
                alert("PIN incorrecto.");
                return;
            }

            const hoy = new Date();
            const fechaExp = new Date(hoy);
            fechaExp.setDate(fechaExp.getDate() + 30);

            const ano = fechaExp.getFullYear();
            const mes = String(fechaExp.getMonth() + 1).padStart(2, '0');
            const dia = String(fechaExp.getDate()).padStart(2, '0');
            const aleatorio = Math.random().toString(36).substring(2, 7).toUpperCase();

            const clave = `SYNC-${ano}${mes}${dia}-${aleatorio}`;
            
            const divRes = document.getElementById("resultado");
            divRes.style.display = "block";
            divRes.innerHTML = "<strong>Clave Generada:</strong><br><br>" + clave;
            
            prompt("Copia esta clave de 30 días:", clave);
        }
    </script>
</body>
</html>
